aid: gel-data
name: Gel Data
description: 'Gel Data (formerly EdgeDB Inc.) builds Gel, an open-source graph-relational
  database that supercharges PostgreSQL with a modern object-oriented data model,
  the EdgeQL query language (with full SQL and GraphQL support), a built-in migration
  and branching system, integrated authentication (OAuth, email/password, magic links,
  passkeys/WebAuthn), and GenAI features (automatic embeddings, RAG, and vector search).
  It ships official client libraries for TypeScript/JavaScript, Python, Go, Rust, .NET,
  Dart, and Elixir, a first-party CLI, a built-in admin UI, an EdgeQL-over-HTTP and
  GraphQL endpoint, an Auth HTTP API with webhooks, and an official MCP server for
  AI coding agents. In late 2025 the company was acquired by Vercel and the managed
  Gel Cloud is being wound down, but the database remains fully open source under the
  geldata GitHub organization.'
